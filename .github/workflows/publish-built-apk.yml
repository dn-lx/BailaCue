name: Recover a built Android preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing preview tag with a prepared draft release
        required: true
      build_run:
        description: Completed preview build run with successful ARTEMIS acceptance
        required: true
permissions:
  contents: write
  actions: read
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Wait for existing build and retrieve its artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          gh run watch "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --interval 15
          native_passes=$(gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.name == "ARTEMIS Android device tests" and .conclusion == "success")] | length')
          test "$native_passes" -ge 1
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name BailaCue-published-preview --dir artifacts
          (cd artifacts && sha256sum --check *.sha256)
      - name: Attach APK to the prepared draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          is_draft=$(gh release view "$PREVIEW_TAG" --json isDraft --jq .isDraft)
          if [ "$is_draft" != true ]; then
            echo 'Release already published; preserving immutable assets.'
            exit 0
          fi
          gh release upload "$PREVIEW_TAG" artifacts/*.apk artifacts/*.sha256 --clobber
          cp "docs/releases/$PREVIEW_TAG.md" /tmp/bailacue-release-notes.md
          printf '\nActual uploaded APK SHA-256:\n\n```text\n' >> /tmp/bailacue-release-notes.md
          cat artifacts/*.sha256 >> /tmp/bailacue-release-notes.md
          printf '```\n' >> /tmp/bailacue-release-notes.md
          gh release edit "$PREVIEW_TAG" --draft=false --prerelease --notes-file /tmp/bailacue-release-notes.md
