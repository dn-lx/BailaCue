name: BailaCue playback copies
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Plan first; apply creates billable playback copies within the configured cap.
        options: [plan, apply]
        default: plan
permissions:
  contents: read
concurrency:
  group: bailacue-stream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: bailacue-stream
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_STREAM_API_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_API_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      STREAM_SYNC_ENABLED: ${{ vars.STREAM_SYNC_ENABLED }}
      STREAM_MAX_STORED_MINUTES: ${{ vars.STREAM_MAX_STORED_MINUTES || '1000' }}
      STREAM_MAX_NEW_PER_RUN: ${{ vars.STREAM_MAX_NEW_PER_RUN || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Review live plan
        if: inputs.mode == 'plan'
        run: node scripts/stream-sync.mjs --plan
      - name: Create or resume bounded playback copies
        if: inputs.mode == 'apply'
        run: node scripts/stream-sync.mjs --apply
