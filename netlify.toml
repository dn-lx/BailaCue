[build]
  base = "web"
  command = "npm run lint && npm run typecheck && npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[context.branch-deploy]
  command = "npm run lint && npm run typecheck && npm test && npm run build"

[context.develop]
  command = "npm run lint && npm run typecheck && npm test && npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://drive.google.com https://*.googleusercontent.com https://i.ytimg.com data:; frame-src https://drive.google.com https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/catalogue.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
